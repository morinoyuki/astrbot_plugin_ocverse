<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分身的世界 · 后台管理</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">🌍 分身的世界 <span class="sub">后台管理</span></div>
  <select id="gid" class="sel"><option value="">加载中…</option></select>
  <span id="who" class="muted"></span>
  <button id="btn-refresh" class="btn ghost" title="重新加载当前页数据">↻ 刷新</button>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" data-tab="overview">📊 总览</button>
  <button class="tab" data-tab="chars">🧑‍🎨 角色</button>
  <button class="tab" data-tab="world">🏙 世界与NPC</button>
  <button class="tab" data-tab="events">🎲 事件</button>
  <button class="tab" data-tab="logs">📜 日志</button>
  <button class="tab" data-tab="mems">🧠 记忆</button>
  <button class="tab" data-tab="config">⚙️ 配置</button>
  <button class="tab" data-tab="ops">🕹 操作</button>
</nav>

<main id="main">
  <section class="panel active" id="tab-overview">
    <div class="cards" id="ov-cards"></div>
    <div class="card"><h3>群参数</h3><pre id="ov-cfg" class="code">-</pre>
    <p class="hint muted">在「配置」页修改。</p></div>
  </section>

  <section class="panel" id="tab-chars">
    <div class="table-wrap"><table class="tbl" id="chars-tbl">
      <thead><tr><th>名字</th><th>uid</th><th>性别</th><th>Lv</th><th>金币</th><th>体力/心情</th><th>称号</th><th>操作</th></tr></thead>
      <tbody></tbody>
    </table></div>
    <div id="cedit"></div>
  </section>

  <section class="panel" id="tab-world">
    <div id="world-wrap"></div>
  </section>

  <section class="panel" id="tab-events">
    <div id="events-wrap"></div>
  </section>

  <section class="panel" id="tab-logs">
    <div class="toolbar">
      <label>角色 <select id="log-uid" class="sel"><option value="">全部</option></select></label>
      <button class="btn ghost" id="log-prev">上一页</button>
      <button class="btn ghost" id="log-next">下一页</button>
      <span class="muted" id="log-total"></span>
    </div>
    <div class="table-wrap"><table class="tbl" id="logs-tbl">
      <thead><tr><th>时间</th><th>角色</th><th>类型</th><th>内容</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </section>

  <section class="panel" id="tab-mems">
    <div class="toolbar">
      <label>角色 <select id="mem-uid" class="sel"><option value="">全部</option></select></label>
      <button class="btn danger" id="mem-del">删除选中</button>
      <span class="muted" id="mem-total"></span>
    </div>
    <div class="table-wrap"><table class="tbl" id="mems-tbl">
      <thead><tr><th></th><th>id</th><th>角色</th><th>范围</th><th>内容</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </section>

  <section class="panel" id="tab-config">
    <div class="card" id="config-card">
      <h3>群参数(覆盖全局默认)</h3>
      <div class="grid">
        <label>每日事件数下限 <input type="number" id="cf-event_min"></label>
        <label>每日事件数上限 <input type="number" id="cf-event_max"></label>
        <label>世界变动概率 % <input type="number" id="cf-shift_percent"></label>
        <label>用户世界份额 % <input type="number" id="cf-user_world_share"></label>
        <label>穿越冷却(小时) <input type="number" id="cf-travel_cooldown_h"></label>
      </div>
      <div class="row-end"><button class="btn primary" id="cf-save">保存</button></div>
    </div>
  </section>

  <section class="panel" id="tab-ops">
    <div class="card">
      <h3>手动触发(结果会照常推送到群里)</h3>
      <div class="row-end">
        <button class="btn" id="op-event">触发一次事件</button>
        <button class="btn" id="op-shift">触发世界变动</button>
        <button class="btn" id="op-morning">生成晨报</button>
      </div>
      <pre id="op-out" class="code">等待操作…</pre>
    </div>
  </section>
</main>

<!-- 通用弹窗(自绘确认/查看:sandbox iframe 里原生 confirm/alert 被禁) -->
<div class="modal-mask" id="modal-mask">
  <div class="modal" role="dialog">
    <div class="modal-head"><strong id="modal-title"></strong></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<div id="toast" class="toast"></div>
<p class="nosbridge hint muted" id="nosbridge" style="display:none;padding:12px 16px">
  ⚠ 未检测到 bridge SDK:请从 Dashboard「插件 → 分身的世界 → 页面」打开本页。
</p>

<script src="/api/plugin/page/bridge-sdk.js"></script>
<script src="./app.js"></script>
</body>
</html>
